<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pong</title>
<style>
  :root{ --bg:#000; --fg:#f2f2f2; --green:#39d353; --blue:#4a9eff; --dim:#5a5a5a; color-scheme: dark; }
  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  body{display:flex;align-items:center;justify-content:center;font-family:'Courier New',Consolas,monospace;}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;}
  #hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:var(--dim);
    font-size:12px;letter-spacing:.02em;pointer-events:none;}
  @media (max-width:520px){ #hint{font-size:10px;} }
  #nameOverlay{display:none;position:fixed;inset:0;z-index:10;background:rgba(0,0,0,0.92);
    align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:20px;
    box-sizing:border-box;font-family:'Courier New',Consolas,monospace;}
  #nameOverlay label{color:var(--dim);font-size:13px;align-self:flex-start;margin-left:2px;}
  #nameOverlay input{font-family:inherit;font-size:18px;padding:8px 10px;border-radius:6px;
    border:1px solid var(--dim);background:#111;color:var(--fg);width:min(260px,70vw);outline:none;}
  #nameOverlay input:focus{border-color:var(--green);}
  #nameOverlay button{font-family:inherit;font-size:15px;padding:8px 18px;border-radius:6px;
    border:1px solid var(--dim);background:#111;color:var(--fg);margin-top:6px;cursor:pointer;}
  #startDuoBtn{border-color:var(--green);color:var(--green);}
  #nameTitle{color:var(--green);font-size:17px;margin-bottom:6px;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Enter confirma · Backspace apaga nome · P pausa · R reinicia · M som · Q menu</div>
<div id="nameOverlay">
  <div id="nameTitle">Nomes dos jogadores</div>
  <label for="name1Input">Jogador 1 (W/S)</label>
  <input id="name1Input" maxlength="14" autocomplete="off" placeholder="Jogador 1">
  <label for="name2Input">Jogador 2 (Setas)</label>
  <input id="name2Input" maxlength="14" autocomplete="off" placeholder="Jogador 2">
  <button id="startDuoBtn" type="button">▶ Começar partida</button>
  <button id="backDuoBtn" type="button">Voltar</button>
</div>
<!-- Cliente do Supabase: só é usado de fato se SUPABASE_URL/SUPABASE_ANON_KEY
     estiverem preenchidos no script abaixo (veja README, seção Supabase + Vercel). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
'use strict';
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const COLOR={bg:'#000',fg:'#f2f2f2',green:'#39d353',blue:'#4a9eff',dim:'#5a5a5a'};
const CFG={WIN:10,BASEV:0.42,PSPEED:1.15,COUNT:3,MAXANG:0.9,PW:10,SPEED_INTERVAL:7,SPEED_MULT:1.5,MAXF:6};
const DIFFS=[
  {name:'Fácil',   reaction:.30,speed:.42,error:28,miss:.36,predict:false,zone:.55},
  {name:'Médio',   reaction:.15,speed:.65,error:16,miss:.22,predict:true, zone:.80},
  {name:'Difícil', reaction:.07,speed:.92,error:8, miss:.12,predict:true, zone:1.0},
];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---------- Som ----------
let actx=null, soundOn=true;
function ensureAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(freq,dur,vol=0.18){
  if(!soundOn||!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='square'; o.frequency.value=freq;
  g.gain.value=vol; g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
}
const SND={
  hit:()=>beep(880,.05), wall:()=>beep(440,.04), tick:()=>beep(600,.08),
  pointP:()=>{beep(660,.08);setTimeout(()=>beep(990,.12),70);},
  pointC:()=>{beep(330,.1);setTimeout(()=>beep(220,.16),90);},
  win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.15),i*110)),
  lose:()=>[392,330,262].forEach((f,i)=>setTimeout(()=>beep(f,.2),i*150)),
};

// ---------- Hall da Fama ----------
// Ordem de prioridade para guardar o placar de campeões:
//  1) Supabase (se SUPABASE_URL/SUPABASE_ANON_KEY abaixo estiverem preenchidos) —
//     compartilhado de verdade entre qualquer pessoa, em qualquer PC, quando este
//     arquivo é hospedado fora do claude.ai (ex.: na Vercel).
//  2) banco embutido do claude.ai (só existe quando esta página foi publicada por lá).
//  3) localStorage do navegador (cada PC guarda o seu próprio placar).
//
// Preencha os dois valores abaixo com os do SEU projeto Supabase (veja o README,
// seção "Supabase + Vercel") para ativar o placar compartilhado de verdade.
const SUPABASE_URL = 'https://pfxjocrjcplrufvrqmif.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmeGpvY3JqY3BscnVmdnJxbWlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2NDQyNDksImV4cCI6MjExMTIyMDI0OX0.yiF6t2-mxakZ101zNrsFfJg-zG9h6abMCse1aqa9oLU';

let champDB=null, sbClient=null, champCache={}, champReady=false;

async function tryLoadSupabase(){
  if(!(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase)) return false;
  try{
    if(!sbClient) sbClient=window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data, error } = await sbClient.from('pong_champions').select('name,wins');
    if(error || !data){ return false; }
    const next={}; data.forEach(r=>{ next[r.name]=r.wins; });
    champCache=next;
    return true;
  }catch(e){ return false; }
}
async function tryLoadClaudeDB(){
  try{
    if(!(window.claude && typeof window.claude.use==='function')) return false;
    champDB=await window.claude.use('db');
    if(!champDB) return false;
    const ref=champDB.doc('champions/hall');
    const snap=await ref.get();
    champCache=(snap.exists && snap.data().wins) || {};
    ref.onSnapshot(s=>{ champCache=(s.exists && s.data().wins) || {}; });
    return true;
  }catch(e){ champDB=null; return false; }
}
async function initChamps(){
  if(await tryLoadSupabase()){ champReady=true; return; }
  if(await tryLoadClaudeDB()){ champReady=true; return; }
  try{ champCache=JSON.parse(localStorage.getItem('pong_champions')||'{}'); }catch(e){ champCache={}; }
  champReady=true;
}
async function recordWin(name){
  if(!name) return;
  champCache[name]=(champCache[name]||0)+1;
  if(sbClient){
    try{ await sbClient.rpc('increment_pong_win',{p_name:name}); return; }catch(e){ /* tenta o próximo nível */ }
  }
  if(champDB){ try{ await champDB.doc('champions/hall').set({wins:champCache}); return; }catch(e){} }
  try{ localStorage.setItem('pong_champions',JSON.stringify(champCache)); }catch(e){}
}
function topChampion(){
  const e=Object.entries(champCache);
  if(!e.length) return null;
  e.sort((a,b)=>b[1]-a[1]);
  return e[0];
}
initChamps();
// Atualiza o placar periodicamente enquanto o menu está aberto (sem precisar
// configurar Realtime no Supabase: é só uma releitura simples a cada 10s).
setInterval(()=>{ if(typeof state!=='undefined' && state==='menu' && sbClient) tryLoadSupabase(); }, 10000);

// ---------- Estado ----------
let W=0,H=0,fieldTop=40,fieldBottom=0,fieldH=0;
const p1={y:0,h:60,x:24,dir:0,name:'Jogador'};
const p2={y:0,h:60,x:0,dir:0,name:'Computador'};
const ball={x:0,y:0,vx:0,vy:0,angle:0,dirSign:1,factor:1};
let state='menu', menuStage='mode', modeIdx=0, paused=false, menuIdx=1, diffIdx=1, endIdx=0, showBoard=false;
let nameField=0, nameBuf=['Jogador 1','Jogador 2'];
let score={p1:0,p2:0}, countdown=0, lastTick=0, matchTime=0;
let aiTimer=0, aiTarget=0, aiOffset=0, aiLastVx=0;

function resize(){
  const dpr=window.devicePixelRatio||1;
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  fieldTop=46; fieldBottom=H-28; fieldH=Math.max(1,fieldBottom-fieldTop);
  const ph=Math.max(40,fieldH*0.18);
  p1.h=ph; p2.h=ph;
  p1.x=Math.max(16,W*0.02); p2.x=W-p1.x-10;
  clampPaddle(p1); clampPaddle(p2);
}
function clampPaddle(p){ p.y=clamp(p.y,fieldTop,fieldBottom-p.h); }
function resetPaddles(){ const y=fieldTop+(fieldH-p1.h)/2; p1.y=y; p2.y=y; p1.dir=0; p2.dir=0; }

function applyVel(){
  const speed=fieldH*CFG.BASEV*ball.factor;
  ball.vx=ball.dirSign*Math.cos(ball.angle)*speed*1.7;
  ball.vy=Math.sin(ball.angle)*speed;
}
function resetBall(dirSign){
  ball.x=W/2; ball.y=fieldTop+fieldH/2; ball.factor=1; ball.dirSign=dirSign;
  ball.angle=(Math.random()*2-1)*0.4; applyVel();
}
function startMatch(){
  if(modeIdx===0){ diffIdx=menuIdx; p1.name=nameBuf[0]||'Jogador'; p2.name=DIFFS[diffIdx].name==='' ? 'Computador' : 'Computador'; }
  else { p1.name=(nameBuf[0]||'Jogador 1').trim()||'Jogador 1'; p2.name=(nameBuf[1]||'Jogador 2').trim()||'Jogador 2'; }
  score={p1:0,p2:0}; paused=false; matchTime=0; resetPaddles();
  beginServe(Math.random()<0.5?-1:1);
}
function beginServe(dir){
  resetBall(dir); state='countdown'; countdown=CFG.COUNT; lastTick=0;
  matchTime=0; // zera o cronômetro de velocidade a cada novo ponto/saque
  aiTimer=0; aiOffset=0; aiLastVx=0;
}
function point(who){
  score[who]++;
  if(score[who]>=CFG.WIN){
    state='gameover'; endIdx=0;
    const winnerName = who==='p1' ? p1.name : p2.name;
    recordWin(winnerName);
    who==='p1'?SND.win():SND.lose();
    return;
  }
  who==='p1'?SND.pointP():SND.pointC();
  beginServe(who==='p1'?1:-1);
}
const diff=()=>DIFFS[diffIdx];

function predictY(){
  if(ball.vx<=0) return ball.y;
  const t=(p2.x-ball.x)/ball.vx;
  let rel=ball.y+ball.vy*t-fieldTop;
  rel=((rel%(2*fieldH))+2*fieldH)%(2*fieldH);
  if(rel>fieldH) rel=2*fieldH-rel;
  return fieldTop+rel;
}
function rollOffset(){
  const d=diff();
  if(Math.random()<d.miss){ const s=Math.random()<0.5?-1:1; return s*(p2.h/2+d.error*1.6); }
  return (Math.random()*2-1)*d.error;
}
function updateAI(dt){
  const d=diff();
  if(ball.vx>0 && aiLastVx<=0) aiOffset=rollOffset();
  aiLastVx=ball.vx;
  aiTimer-=dt;
  if(aiTimer<=0){
    aiTimer=d.reaction;
    const mid=fieldTop+fieldH/2;
    const active=state==='playing'&&ball.vx>0&&ball.x>=W*(1-d.zone);
    aiTarget=active?(d.predict?predictY():ball.y)+aiOffset:mid;
  }
  const center=p2.y+p2.h/2, dY=aiTarget-center, step=d.speed*fieldH*dt;
  if(Math.abs(dY)>2) p2.y+=clamp(dY,-step,step);
  clampPaddle(p2);
}
function updatePaddle(p,dt){
  if(p.dir!==0){ p.y+=p.dir*CFG.PSPEED*fieldH*dt; clampPaddle(p); }
}
function hitTest(p,y){ return y>=p.y-6 && y<p.y+p.h+6; }
function bounceOff(p,yHit,dir){
  const rel=clamp((yHit-(p.y+p.h/2))/(p.h/2),-1,1);
  let a=rel*CFG.MAXANG; if(Math.abs(a)<0.1) a=(Math.random()<0.5?-1:1)*0.1;
  ball.angle=a; ball.dirSign=dir;
  ball.x=dir>0 ? p1.x+CFG.PW+1 : p2.x-1;   // usa a largura fixa da raquete
  applyVel(); SND.hit();
}
function updateBall(dt){
  const px=ball.x,py=ball.y;
  ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
  const faceL=p1.x+CFG.PW, faceR=p2.x;
  if(ball.vx<0 && px>=faceL && ball.x<faceL){
    const yHit=py+(ball.y-py)*((px-faceL)/(px-ball.x));
    if(hitTest(p1,yHit)) bounceOff(p1,yHit,1);
  } else if(ball.vx>0 && px<=faceR && ball.x>faceR){
    const yHit=py+(ball.y-py)*((faceR-px)/(ball.x-px));
    if(hitTest(p2,yHit)) bounceOff(p2,yHit,-1);
  }
  if(ball.y<fieldTop){ ball.y=fieldTop+(fieldTop-ball.y); ball.angle=Math.abs(ball.angle); applyVel(); SND.wall(); }
  else if(ball.y>fieldBottom){ ball.y=fieldBottom-(ball.y-fieldBottom); ball.angle=-Math.abs(ball.angle); applyVel(); SND.wall(); }
  if(ball.x<0) point('p2'); else if(ball.x>W) point('p1');
}
function update(dt){
  if(state==='countdown'){
    updatePaddle(p1,dt); modeIdx===0?updateAI(dt):updatePaddle(p2,dt);
    countdown-=dt; const n=Math.ceil(countdown);
    if(n>0 && n!==lastTick){ lastTick=n; SND.tick(); }
    if(countdown<=0) state='playing';
  } else if(state==='playing' && !paused){
    updatePaddle(p1,dt); modeIdx===0?updateAI(dt):updatePaddle(p2,dt); updateBall(dt);
    // velocidade da bola sobe de forma contínua e suave, equivalente a 1,5x a cada
    // 7s de partida (sem saltos: recalculada a cada quadro), até o teto CFG.MAXF
    matchTime+=dt;
    const newFactor=Math.min(Math.pow(CFG.SPEED_MULT, matchTime/CFG.SPEED_INTERVAL), CFG.MAXF);
    if(newFactor!==ball.factor){ ball.factor=newFactor; applyVel(); }
  }
}

// ---------- Desenho ----------
function text(str,x,y,color,size=16,align='left'){
  ctx.fillStyle=color; ctx.font=`${size}px 'Courier New', monospace`; ctx.textAlign=align; ctx.textBaseline='middle';
  ctx.fillText(str,x,y);
}
function draw(){
  ctx.fillStyle=COLOR.bg; ctx.fillRect(0,0,W,H);
  if(state==='menu' && showBoard) drawBoard();
  else if(state==='menu') drawMenu();
  else if(state==='gameover') drawGameOver();
  else drawMatch();
}
function drawBoard(){
  let y=H*0.14;
  text('🏆 Placar do Campeonato',W/2,y,COLOR.green,Math.min(24,W*0.05),'center'); y+=44;
  const ranked=Object.entries(champCache).sort((a,b)=>b[1]-a[1]);
  if(!ranked.length){
    text('Ninguém venceu uma partida ainda — jogue a primeira!',W/2,y,COLOR.dim,15,'center');
  } else {
    ranked.slice(0,12).forEach(([name,wins],i)=>{
      const medal=['🥇','🥈','🥉'][i]||`${i+1}.`;
      text(`${medal}  ${name}`,W*0.28,y,i===0?COLOR.green:COLOR.fg,17,'left');
      text(`${wins} vitória${wins>1?'s':''}`,W*0.72,y,COLOR.blue,15,'right');
      y+=30;
    });
  }
  y+=24;
  text(sbClient?'Placar compartilhado (Supabase) · atualizado agora':
       champDB?'Placar compartilhado (claude.ai)':'Placar salvo só neste navegador',
       W/2,y,COLOR.dim,12,'center'); y+=20;
  text('Qualquer tecla volta ao menu',W/2,y,COLOR.dim,13,'center');
}
function drawMenu(){
  let y=H*0.2;
  text('P O N G',W/2,y,COLOR.green,Math.min(60,W*0.11),'center'); y+=44;
  const champ=topChampion();
  if(champ) text(`🏆 Maior campeão: ${champ[0]} (${champ[1]} vitória${champ[1]>1?'s':''})`,W/2,y,COLOR.blue,14,'center');
  y+=40;
  if(menuStage==='mode'){
    text('Escolha o modo de jogo',W/2,y,COLOR.fg,17,'center'); y+=38;
    ['1 Jogador (vs Computador)','2 Jogadores (W/S × Setas)'].forEach((t,i)=>{
      const sel=i===modeIdx;
      text(`${sel?'▶ ':'   '}${t}`,W/2,y,sel?COLOR.green:COLOR.dim,18,'center'); y+=32;
    });
    y+=20; text('↑/↓ navegar · Enter confirmar · L placar completo',W/2,y,COLOR.dim,13,'center'); y+=22;
    text(`M som: ${soundOn?'ligado':'desligado'}`,W/2,y,COLOR.blue,13,'center');
  } else if(menuStage==='difficulty'){
    text('Escolha a dificuldade',W/2,y,COLOR.fg,17,'center'); y+=38;
    DIFFS.forEach((d,i)=>{
      const sel=i===menuIdx;
      text(`${sel?'▶ ':'   '}${i+1}. ${d.name}`,W/2,y,sel?COLOR.green:COLOR.dim,19,'center'); y+=32;
    });
    y+=20; text('↑/↓ navegar · Enter confirmar · 1-3 atalho · Q voltar',W/2,y,COLOR.dim,13,'center');
  }
  // menuStage 'names': a tela de nomes agora é o overlay HTML #nameOverlay (ver showNameOverlay),
  // que cobre a tela inteira, então não há nada a desenhar aqui no canvas.
}
function drawGameOver(){
  const won=score.p1>score.p2;
  const items=['Jogar de novo','Voltar ao menu'];
  let y=H*0.28;
  text(won?`${p1.name} VENCEU!`:`${p2.name} VENCEU!`,W/2,y,won?COLOR.green:COLOR.blue,28,'center'); y+=44;
  text(`Placar final: ${score.p1} × ${score.p2}`,W/2,y,COLOR.fg,16,'center'); y+=24;
  if(modeIdx===0){ text(`Dificuldade: ${diff().name}`,W/2,y,COLOR.dim,14,'center'); y+=30; } else y+=6;
  items.forEach((t,i)=>{
    const sel=i===endIdx;
    text(`${sel?'▶ ':'   '}${t}`,W/2,y,sel?COLOR.green:COLOR.dim,18,'center'); y+=32;
  });
  y+=16; text('↑/↓ escolher · Enter confirmar',W/2,y,COLOR.dim,13,'center');
}
function drawMatch(){
  text(`${p1.name.toUpperCase()} ${score.p1}  :  ${score.p2} ${p2.name.toUpperCase()}`,W/2,22,COLOR.fg,Math.min(20,W*0.045),'center');
  text(modeIdx===0?`Nível: ${diff().name}`:'2 Jogadores',14,22,COLOR.dim,12,'left');
  text(`Som: ${soundOn?'ligado':'desligado'}`,W-14,22,COLOR.dim,12,'right');
  ctx.strokeStyle=COLOR.fg; ctx.globalAlpha=0.5;
  ctx.beginPath(); ctx.moveTo(0,fieldTop-6); ctx.lineTo(W,fieldTop-6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,fieldBottom+6); ctx.lineTo(W,fieldBottom+6); ctx.stroke();
  ctx.setLineDash([6,10]); ctx.beginPath(); ctx.moveTo(W/2,fieldTop); ctx.lineTo(W/2,fieldBottom); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha=1;
  ctx.fillStyle=COLOR.fg;
  ctx.fillRect(p1.x,p1.y,CFG.PW,p1.h);
  ctx.fillRect(p2.x,p2.y,CFG.PW,p2.h);
  ctx.beginPath(); ctx.arc(ball.x,ball.y,7,0,Math.PI*2); ctx.fill();
  if(paused) overlay(['PAUSADO','','P continuar · R reiniciar · Q menu']);
  else if(state==='countdown'){
    text(Math.max(1,Math.ceil(countdown)).toString(),W/2,fieldTop+fieldH/2-20,COLOR.fg,48,'center');
    text('Prepare-se!',W/2,fieldTop+fieldH/2+30,COLOR.blue,16,'center');
  }
}
function overlay(lines){
  const bw=Math.min(W*0.7,340), bh=lines.length*26+28;
  const x0=(W-bw)/2, y0=(H-bh)/2;
  ctx.fillStyle='rgba(0,0,0,0.85)'; ctx.fillRect(x0,y0,bw,bh);
  ctx.strokeStyle=COLOR.fg; ctx.strokeRect(x0,y0,bw,bh);
  lines.forEach((l,i)=>text(l,W/2,y0+22+i*26,COLOR.fg,16,'center'));
}

// ---------- Campo de nomes (overlay HTML real, funciona com teclado físico e do celular) ----------
const nameOverlay=document.getElementById('nameOverlay');
const name1Input=document.getElementById('name1Input');
const name2Input=document.getElementById('name2Input');
function showNameOverlay(){
  name1Input.value=nameBuf[0]||''; name2Input.value=nameBuf[1]||'';
  nameOverlay.style.display='flex';
  setTimeout(()=>name1Input.focus(),0);
}
function hideNameOverlay(){
  nameOverlay.style.display='none';
  // devolve o foco ao jogo, senão os controles (W/S/setas) ficariam travados
  if(document.activeElement===name1Input || document.activeElement===name2Input) document.activeElement.blur();
}
function confirmNames(){
  nameBuf[0]=(name1Input.value||'').trim()||'Jogador 1';
  nameBuf[1]=(name2Input.value||'').trim()||'Jogador 2';
  menuStage='mode'; hideNameOverlay(); startMatch();
}
document.getElementById('startDuoBtn').addEventListener('click',confirmNames);
document.getElementById('backDuoBtn').addEventListener('click',()=>{ menuStage='mode'; hideNameOverlay(); });
name1Input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); name2Input.focus(); } });
name2Input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); confirmNames(); } });

// ---------- Teclado ----------
function onKey(e,down){
  // Enquanto o campo de nomes está em foco, deixa o navegador cuidar da digitação
  // normalmente (inclusive teclado virtual do celular) e ignora os atalhos do jogo.
  if(document.activeElement===name1Input || document.activeElement===name2Input) return;
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown',' ','tab'].includes(k)) e.preventDefault();
  if(!down){
    if((k==='arrowup'||k==='w') && p1.dir===-1 && !(modeIdx===1 && k.startsWith('arrow'))) p1.dir=0;
    if((k==='arrowdown'||k==='s') && p1.dir===1 && !(modeIdx===1 && k.startsWith('arrow'))) p1.dir=0;
    if(modeIdx===1 && k==='arrowup' && p2.dir===-1) p2.dir=0;
    if(modeIdx===1 && k==='arrowdown' && p2.dir===1) p2.dir=0;
    return;
  }
  ensureAudio();
  if(k==='m'){ soundOn=!soundOn; if(soundOn) SND.tick(); return; }
  if(state==='menu' && showBoard){
    showBoard=false; if(sbClient) tryLoadSupabase(); return;
  }
  if(state==='menu'){
    if(menuStage==='mode'){
      if(k==='l'){ showBoard=true; return; }
      if(k==='arrowup'||k==='w') modeIdx=(modeIdx+1)%2;
      else if(k==='arrowdown'||k==='s') modeIdx=(modeIdx+1)%2;
      else if(k==='enter'){
        menuStage = modeIdx===0 ? 'difficulty' : 'names';
        if(menuStage==='names') showNameOverlay();
      }
    } else if(menuStage==='difficulty'){
      if(k==='arrowup'||k==='w') menuIdx=(menuIdx+DIFFS.length-1)%DIFFS.length;
      else if(k==='arrowdown'||k==='s') menuIdx=(menuIdx+1)%DIFFS.length;
      else if(k>='1'&&k<=String(DIFFS.length)){ menuIdx=Number(k)-1; startMatch(); }
      else if(k==='enter') startMatch();
      else if(k==='q') menuStage='mode';
    }
  } else if(state==='countdown'||state==='playing'){
    if(modeIdx===0){
      if(k==='arrowup'||k==='w') p1.dir=-1;
      else if(k==='arrowdown'||k==='s') p1.dir=1;
    } else {
      if(k==='w') p1.dir=-1; else if(k==='s') p1.dir=1;
      if(k==='arrowup') p2.dir=-1; else if(k==='arrowdown') p2.dir=1;
    }
    if(k==='p') paused=!paused;
    else if(k==='r') startMatch();
    else if(k==='q'){ state='menu'; menuStage='mode'; paused=false; }
  } else if(state==='gameover'){
    if(k==='arrowup'||k==='w'||k==='arrowdown'||k==='s') endIdx=(endIdx+1)%2;
    else if(k==='r') startMatch();
    else if(k==='q') { state='menu'; menuStage='mode'; }
    else if(k==='enter') endIdx===0 ? startMatch() : (state='menu', menuStage='mode');
  }
}
window.addEventListener('keydown',e=>onKey(e,true));
window.addEventListener('keyup',e=>onKey(e,false));
window.addEventListener('resize',()=>{ resize(); resetPaddles(); });
cv.addEventListener('pointerdown',()=>ensureAudio());

// ---------- Loop ----------
resize(); resetPaddles();
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
